    <!-- Early Theme Initializer (Prevents Flash of Wrong Theme) -->
    <script>
      (function() {
        try {
          var savedSettings = localStorage.getItem('chidoniq_app_settings_fresh_v9') || localStorage.getItem('chidoniq_theme');
          var isDark = false;
          if (savedSettings) {
            if (savedSettings === 'dark') isDark = true;
            else if (savedSettings === 'light') isDark = false;
            else {
              var parsed = JSON.parse(savedSettings);
              if (parsed && parsed.theme === 'dark') isDark = true;
              else if (parsed && parsed.theme === 'light') isDark = false;
            }
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
