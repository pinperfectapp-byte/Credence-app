    <!-- CLEAN GEOMETRIC ACCENTS (Zero AI stars) -->
    <circle cx="166" cy="46" r="3.5" fill="#38BDF8" />
    <circle cx="152" cy="62" r="2.5" fill="#60A5FA" opacity="0.8" />
