# Netlify Production Configuration for CHIDONIQ (https://chidoniq.com.ng)
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA Single-Page-App Fallback Routing: ensures all subroutes & tab URLs resolve to /index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Canonical Domain Redirection Rule (ensures apex and alternate traffic resolve to chidoniq.com.ng)
[[redirects]]
  from = "https://www.chidoniq.com.ng/*"
  to = "https://chidoniq.com.ng/:splat"
  status = 301
  force = true

# Production Security & Search Engine Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Cache Optimization for Immutable Build Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Rules for SEO & Crawlers (Sitemap & Robots must stay fresh)
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
    Cache-Control = "public, max-age=86400"
